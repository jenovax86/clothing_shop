services:
  database:
    image: mysql:latest
    container_name: clothing-shop-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: clothing_store
    ports:
      - "3306:3306"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - database

    command: python manage.py runserver 0.0.0.0:8000

